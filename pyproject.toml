[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "uptime-certificate-monitor"
version = "0.1.0"
description = "Monitor HTTP availability and SSL certificate expiration"
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name="Morpheus" }
]

license = "MIT"

keywords = [
    "monitoring",
    "http",
    "ssl",
    "certificate",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]
